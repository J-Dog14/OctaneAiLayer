# ═════════════════════════════════════════════════════════════════════════
# VOCABULARY — used to auto-compose names for uncurated kin_* / fm_* keys.
# Anything built from this is status=auto and never appears on a coach page
# with a plain-language label.
# ═════════════════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════════
  # Added from `research metric-coverage --status raw`: every metric
  # below was carrying real data but had no coach-facing name, so its
  # findings were held off the page and filed under a warehouse key.
  # ══════════════════════════════════════════════════════════════════

  score:
    name: "Delivery score"
    short: "Delivery score"
    definition: >-
      The pipeline's composite score for the delivery, built from
      the mechanical variables in the scoring formula. Read the
      inputs before the score — a composite can move for reasons
      that cancel out underneath.
    direction: higher_better
    group: output
    status: curated

  kin_BALLSPEED.SPIN_RATE.X:
    name: "Spin rate"
    short: "Spin rate"
    definition: >-
      Ball spin measured at release.
    unit: "rpm"
    direction: context
    group: output
    status: curated

  kin_BALLSPEED.SPIN_AXIS.X:
    name: "Spin axis"
    short: "Spin axis"
    definition: >-
      Orientation of the spin axis at release.
    unit: "deg"
    direction: context
    group: output
    status: curated

  kin_STRIDE_LENGTH.STRIDE_LENGTH.X:
    name: "Stride length"
    short: "Stride"
    definition: >-
      Distance from the back foot at setup to the front foot at
      landing.
    unit: "m"
    direction: context
    group: lower_half
    cue: "Same stride every pitch beats a long one."
    status: curated

  kin_STRIDE_LENGTH.STRIDE_LENGTH_MEAN_PERCENT.X:
    name: "Stride length (% of height)"
    short: "Stride %"
    definition: >-
      Stride length as a share of standing height, so it compares
      across athletes of different sizes.
    unit: "%"
    direction: context
    group: lower_half
    status: curated

  kin_MODEL.LAR_Seg_Length.X:
    name: "Left arm segment length (model)"
    short: "LAR length"
    definition: >-
      Fixed by where the markers were placed and how the model was
      built, not measured from the athlete. It changes when the
      marker set changes, which is why it is kept out of the change
      tables.
    unit: "m"
    direction: context
    group: other
    status: curated

  kin_MODEL.RAR_Seg_Length.X:
    name: "Right arm segment length (model)"
    short: "RAR length"
    definition: >-
      Fixed by where the markers were placed and how the model was
      built, not measured from the athlete. It changes when the
      marker set changes, which is why it is kept out of the change
      tables.
    unit: "m"
    direction: context
    group: other
    status: curated

  kin_MODEL.LTH_Seg_Length.X:
    name: "Left thigh segment length (model)"
    short: "LTH length"
    definition: >-
      Fixed by where the markers were placed and how the model was
      built, not measured from the athlete. It changes when the
      marker set changes, which is why it is kept out of the change
      tables.
    unit: "m"
    direction: context
    group: other
    status: curated

  kin_MODEL.RTH_Seg_Length.X:
    name: "Right thigh segment length (model)"
    short: "RTH length"
    definition: >-
      Fixed by where the markers were placed and how the model was
      built, not measured from the athlete. It changes when the
      marker set changes, which is why it is kept out of the change
      tables.
    unit: "m"
    direction: context
    group: other
    status: curated

  kin_MODEL.RTA_Seg_Length.X:
    name: "Right shank segment length (model)"
    short: "RTA length"
    definition: >-
      Fixed by where the markers were placed and how the model was
      built, not measured from the athlete. It changes when the
      marker set changes, which is why it is kept out of the change
      tables.
    unit: "m"
    direction: context
    group: other
    status: curated

  fm_body_weight_kg:
    name: "Body weight"
    short: "Weight"
    definition: >-
      The weight used to normalise every force metric on this
      capture. If it is wrong, every BW-normalised number on the
      page is wrong with it.
    unit: "kg"
    direction: context
    group: other
    status: curated

  fm_body_weight_n:
    name: "Body weight (newtons)"
    short: "Weight (N)"
    definition: >-
      The same weight expressed as a force. Kept for the force
      maths; the kilogram version is the one to read.
    unit: "N"
    direction: context
    group: other
    status: curated

  fm_fc_time_s:
    name: "Front foot contact — clock time in capture"
    short: "Front clock"
    definition: >-
      Where this event falls on the capture's own clock, which
      starts whenever recording started. It says nothing about the
      delivery — the intervals between events do. Not differenced
      between captures.
    unit: "s"
    direction: context
    group: timing
    status: curated

  fm_br_time_s:
    name: "Ball release — clock time in capture"
