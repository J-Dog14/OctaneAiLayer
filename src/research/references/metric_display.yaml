# ─────────────────────────────────────────────────────────────────────────
# Coach-facing metric dictionary
#
# Purpose: one place that turns a warehouse key like
#   fm_lead_rfd_braking_bw_per_s
# into something a coach reads without translating:
#   "Front-leg braking rate — how fast he gets the brakes on after landing"
#
# Two layers:
#   metrics:    hand-curated entries. These are the only ones allowed to
#               appear on a coach-facing page with a plain-language name.
#   vocabulary: token tables the composer uses to auto-generate a readable
#               (but uncurated) name for the long tail of ~600 kin_* keys.
#               Auto names are marked status=auto and are shown only in the
#               analyst appendix.
#
# direction values:
#   higher_better  — more is better, all else equal
#   lower_better   — less is better, all else equal
#   context        — depends on the athlete / archetype; do NOT colour it
#   load           — a tissue-load measure. Higher is not "worse technique",
#                    it is more stress. Never render as good/bad.
#   review         — nobody has decided yet. Rendered as context + flagged
#                    in `research metric-coverage`.
#
# Adding an entry is the ONLY thing needed to promote a metric to
# coach-facing. Run `python -m src.main research metric-coverage` to see
# what is still missing, ranked by how often it actually shows up.
# ─────────────────────────────────────────────────────────────────────────
version: 2

groups:
  sequencing:   {label: "Sequencing & separation", order: 10}
  force:        {label: "Force & ground contact",  order: 20}
  lower_half:   {label: "Lower half",              order: 30}
  arm:          {label: "Arm action",              order: 40}
  posture:      {label: "Posture & direction",     order: 50}
  timing:       {label: "Timing",                  order: 60}
  output:       {label: "Output",                  order: 70}
  mobility:     {label: "Mobility & ROM",          order: 80}
  strength:     {label: "Strength & power",        order: 90}
  jump:         {label: "Jump & reactive",         order: 100}
  load:         {label: "Arm load",                order: 110}
  other:        {label: "Other",                   order: 999}

# ═════════════════════════════════════════════════════════════════════════
# CURATED
# ═════════════════════════════════════════════════════════════════════════
metrics:

  # ── Output ─────────────────────────────────────────────────────────────
  velocity_mph:
    name: "Pitch velocity"
    short: "Velo"
    definition: "Ball speed out of the hand."
    unit: mph
    direction: higher_better
    group: output
    status: curated

  pitch_ball_release_speed:
    name: "Pitch velocity"
    short: "Velo"
    definition: "Ball speed out of the hand."
    unit: mph
    direction: higher_better
    group: output
    status: curated

  # ── Sequencing & separation ────────────────────────────────────────────
  pitch_hip_shoulder_sep_at_fc:
    name: "Hip–shoulder separation at foot strike"
    short: "Hip–shoulder sep"
    definition: >-
      How far the pelvis has rotated ahead of the torso at the instant the
      front foot lands. The stretch the upper half gets to fire against.
    unit: deg
    direction: higher_better
    group: sequencing
    cue: "Hips first, chest stays closed through landing."
    status: curated

  pitch_hss_at_fc_120ms_z:
    name: "Hip–shoulder separation, 120 ms before foot strike"
    short: "Hip–shoulder sep (−120 ms)"
    definition: >-
      Separation measured a tenth of a second before landing — catches whether
      the separation is being built into the stride or created late.
    unit: deg
    direction: context
    group: sequencing
    status: curated

  pitch_trunk_rot_wrt_pelvis_at_fc:
    name: "Torso rotation relative to pelvis at foot strike"
    short: "Torso-on-pelvis at FS"
    definition: "Torso angle measured against the pelvis rather than the world at landing."
    unit: deg
    direction: context
    group: sequencing
    status: curated

  pitch_pelvis_ang_vel_max:
    name: "Peak pelvis rotation speed"
    short: "Peak pelvis speed"
    definition: "Fastest the hips rotate at any point in the delivery."
    unit: deg/s
    direction: higher_better
    group: sequencing
    status: curated

  pitch_thorax_ang_vel_max:
    name: "Peak torso rotation speed"
    short: "Peak torso speed"
    definition: "Fastest the chest rotates at any point in the delivery."
    unit: deg/s
    direction: higher_better
    group: sequencing
    status: curated

  pitch_time_max_pelvis_to_max_thorax:
    name: "Pelvis-to-torso handoff time"
    short: "Hips→chest handoff"
    definition: >-
      Gap between the hips hitting top speed and the chest hitting top speed.
      The core of the kinematic sequence — too short means they are going
      together instead of in order.
    unit: s
    direction: context
    group: sequencing
    cue: "Feel the hips finish before the chest starts."
    status: curated

  pitch_pelvis_ang_vel_at_fc:
    name: "Pelvis rotation speed at foot strike"
    short: "Pelvis speed at FS"
    definition: "How fast the hips are already turning when the front foot lands."
    unit: deg/s
    direction: context
    group: sequencing
    status: curated

  pitch_pelvis_ang_vel_at_max_er:
    name: "Pelvis rotation speed at max external rotation"
    short: "Pelvis speed at max ER"
    definition: "Hip rotation speed at the arm's lay-back position."
    unit: deg/s
    direction: context
    group: sequencing
    status: curated

  pitch_pelvis_rotation_at_fc:
    name: "Pelvis rotation at foot strike"
    short: "Pelvis rotation at FS"
    definition: "How far the hips have opened to the target when the front foot lands."
    unit: deg
    direction: context
    group: sequencing
    status: curated

  pitch_pelvis_rot_stop_time:
    name: "Pelvis rotation stop time"
    short: "Pelvis stop"
    definition: >-
      When the hips stop rotating. A clean stop is what the torso accelerates
      against; hips that keep drifting bleed energy out of the chain.
    unit: s
    direction: context
    group: sequencing
    status: curated

  # ── Force & ground contact (Visual3D-derived) ──────────────────────────
  pitch_lead_leg_grf_mag_max:
    name: "Peak front-leg ground force"
    short: "Front-leg peak force"
    definition: "Largest total force the front leg puts into the ground."
    unit: N
    direction: higher_better
    group: force
    status: curated

  pitch_lead_leg_grf_max_z:
    name: "Peak front-leg vertical force"
    short: "Front-leg vertical peak"
    definition: "Largest straight-down force through the front leg."
    unit: N
    direction: higher_better
    group: force
    status: curated

  pitch_lead_leg_grf_min_y_abs:
    name: "Peak front-leg braking force"
    short: "Front-leg braking peak"
    definition: "Largest backward force the front leg uses to stop forward momentum."
    unit: N
    direction: higher_better
    group: force
    status: curated

  pitch_lead_leg_grf_mag_midpoint:
    name: "Front-leg force at midpoint of foot strike → release"
    short: "Front-leg force at midpoint"
    definition: "How much force the front leg is holding halfway between landing and release."
    unit: N
    direction: context
    group: force
    status: curated

  pitch_back_leg_grf_mag_max:
    name: "Peak back-leg ground force"
    short: "Back-leg peak force"
    definition: "Largest total force the drive leg puts into the ground."
    unit: N
    direction: higher_better
    group: force
    status: curated

  pitch_front_leg_extension:
    name: "Front-leg extension"
    short: "Front-leg extension"
    definition: "How much the front knee straightens from landing into release."
    unit: deg
    direction: context
    group: lower_half
    cue: "Post and push the hip back over the front foot."
    status: curated

  # ── Force plate (f_pitching_force_metrics) ─────────────────────────────
  fm_lead_peak_vertical_bw:
    name: "Front-leg peak vertical force"
    short: "Front-leg vertical peak"
    definition: "Biggest straight-down push through the front leg, in bodyweights."
    unit: BW
    direction: higher_better
    group: force
    status: curated

  fm_lead_peak_braking_bw:
    name: "Front-leg peak braking force"
    short: "Front-leg braking peak"
    definition: "Biggest backward force the front leg uses to stop the body, in bodyweights."
    unit: BW
    direction: higher_better
    group: force
    cue: "Land to stop, not to absorb."
    status: curated

  fm_lead_peak_resultant_bw:
    name: "Front-leg peak total force"
    short: "Front-leg total peak"
    definition: "Biggest combined (vertical + braking) force through the front leg."
    unit: BW
    direction: higher_better
    group: force
    status: curated

  fm_lead_rfd_vertical_bw_per_s:
    name: "Front-leg vertical force rate"
    short: "Vertical force rate"
    definition: >-
      How fast the front leg builds straight-down force after landing. Two
      pitchers can hit the same peak; the one who gets there faster has more
      of it available before release.
    unit: BW/s
    direction: higher_better
    group: force
    cue: "Beat the ground quickly — the peak has to arrive early."
    status: curated

  fm_lead_rfd_braking_bw_per_s:
    name: "Front-leg braking rate"
    short: "Braking rate"
    definition: "How fast the front leg gets the brakes on after the foot lands."
    unit: BW/s
    direction: higher_better
    group: force
    cue: "Stiff front side — stop the hip, don't ride it."
    status: curated

  fm_lead_time_to_peak_fz_ms:
    name: "Time to peak front-leg vertical force"
    short: "Time to vertical peak"
    definition: "How long after landing the front leg reaches its biggest downward push."
    unit: ms
    direction: lower_better
    group: force
    status: curated

  fm_peak_v_to_peak_b_lag_ms:
    name: "Vertical-to-braking peak lag"
    short: "Peak stacking"
    definition: >-
      Gap between the vertical force peak and the braking force peak. Near
      zero means the two peaks stack into one clean impulse; a large gap
      means the front leg is doing two separate jobs.
    unit: ms
    direction: lower_better
    group: force
    cue: "One block, not a catch-then-push."
    status: curated

  fm_impulse_peak_count:
    name: "Front-leg force peak count"
    short: "Force peaks"
    definition: >-
      How many distinct force peaks the front leg produces between landing
      and release. One is a clean single block; more than one usually means
      the athlete re-loads after landing.
    unit: count
    direction: lower_better
    group: force
    status: curated

  fm_lead_impulse_v_into_ball_bws:
    name: "Front-leg vertical impulse into the ball"
    short: "Vertical impulse"
    definition: >-
      Total downward force multiplied by the time it is applied, over the
      window that actually contributes to the pitch.
    unit: BW·s
    direction: higher_better
    group: force
    status: curated

  fm_lead_impulse_b_into_ball_bws:
    name: "Front-leg braking impulse into the ball"
    short: "Braking impulse"
    definition: "Total braking force multiplied by the time it is applied, over the release window."
    unit: BW·s
    direction: higher_better
    group: force
    status: curated

  fm_lead_impulse_resultant_into_ball_bws:
    name: "Front-leg total impulse into the ball"
    short: "Total impulse"
    definition: "Combined vertical and braking impulse over the release window."
    unit: BW·s
    direction: higher_better
    group: force
    status: curated

  fm_drive_peak_vertical_bw:
    name: "Back-leg peak vertical force"
    short: "Back-leg vertical peak"
    definition: "Biggest downward push off the rubber, in bodyweights."
    unit: BW
    direction: higher_better
    group: force
    status: curated

  fm_drive_peak_braking_bw:
    name: "Back-leg peak braking force"
    short: "Back-leg braking peak"
    definition: "Biggest backward force through the drive leg."
    unit: BW
    direction: context
    group: force
    status: curated

  fm_drive_to_lead_handoff_ms:
    name: "Back-leg to front-leg handoff time"
    short: "Leg handoff"
    definition: "Gap between the drive leg unloading and the front leg taking over."
    unit: ms
    direction: context
    group: timing
    status: curated

  fm_fc_to_br_duration_s:
    name: "Foot strike to release time"
    short: "FS→release"
    definition: >-
      How long the athlete spends between the front foot landing and letting
      go of the ball. Shorter is quicker but leaves less time to apply force.
    unit: s
    direction: context
    group: timing
    status: curated

  fm_total_vertical_peak_n:
    name: "Peak total vertical force (both legs)"
    short: "Total vertical peak"
    definition: "Largest combined downward force from both plates."
    unit: N
    direction: higher_better
    group: force
    status: curated

  fm_foot_loading_time_ms:
    name: "Front-foot loading time"
    short: "Loading time"
    definition: "How long the front foot takes to go from first contact to full load."
    unit: ms
    direction: lower_better
    group: force
    status: curated

  # Alias family: the pitch_force_* profile keys mirror the fm_* trial keys.
  pitch_force_lead_peak_braking_bw:      {alias_of: fm_lead_peak_braking_bw}
  pitch_force_lead_peak_vertical_bw:     {alias_of: fm_lead_peak_vertical_bw}
  pitch_force_lead_peak_resultant_bw:    {alias_of: fm_lead_peak_resultant_bw}
  pitch_force_lead_rfd_braking_bw_per_s: {alias_of: fm_lead_rfd_braking_bw_per_s}
  pitch_force_lead_rfd_vertical_bw_per_s: {alias_of: fm_lead_rfd_vertical_bw_per_s}
  pitch_force_lead_impulse_v_into_ball_bws: {alias_of: fm_lead_impulse_v_into_ball_bws}
  pitch_force_lead_impulse_b_into_ball_bws: {alias_of: fm_lead_impulse_b_into_ball_bws}
  pitch_force_lead_time_to_peak_fz_ms:   {alias_of: fm_lead_time_to_peak_fz_ms}
  pitch_force_peak_v_to_b_lag_ms:        {alias_of: fm_peak_v_to_peak_b_lag_ms}

  pitch_force_lead_fz_at_midpoint_bw:
    name: "Front-leg vertical force at midpoint"
    short: "Vertical at midpoint"
    definition: "Downward force through the front leg halfway from landing to release."
    unit: BW
    direction: context
    group: force
    status: curated

  pitch_force_lead_peak_vertical_pct_fc_br:
    name: "When the front-leg vertical peak happens"
    short: "Vertical peak timing"
    definition: >-
      Where the vertical force peak falls between landing (0%) and release
      (100%). Early peaks mean the force is available while the arm is still
      accelerating.
    unit: "%"
    direction: lower_better
    group: force
    status: curated

  pitch_force_peaks_before_mer:
    name: "Force peaks before max external rotation"
    short: "Peaks before max ER"
    definition: "How many front-leg force peaks land before the arm reaches full lay-back."
    unit: count
    direction: context
    group: force
    status: curated

  # ── Lower half ─────────────────────────────────────────────────────────
  pitch_stride_length:
    name: "Stride length"
    short: "Stride"
    definition: "Distance from the rubber to front-foot contact."
    unit: in
    direction: context
    group: lower_half
    status: curated

  pitch_stride_length_mean_percent:
    name: "Stride length as % of height"
    short: "Stride (% height)"
    definition: "Stride length normalised to the athlete's height, so tall and short pitchers compare."
    unit: "%"
    direction: context
    group: lower_half
    status: curated

  pitch_lead_knee_at_fc:
    name: "Front knee angle at foot strike"
    short: "Front knee at FS"
    definition: "How bent the front knee is the moment it lands."
    unit: deg
    direction: context
    group: lower_half
    status: curated

  pitch_lead_knee_at_release:
    name: "Front knee angle at release"
    short: "Front knee at release"
    definition: "How bent the front knee is when the ball comes out — the block."
    unit: deg
    direction: context
    group: lower_half
    cue: "Front leg firms up as the chest comes over it."
    status: curated

  pitch_back_knee_at_fc:
    name: "Back knee angle at foot strike"
    short: "Back knee at FS"
    definition: "Drive-leg knee bend at the moment the front foot lands."
    unit: deg
    direction: context
    group: lower_half
    status: curated

  pitch_back_knee_at_max_er:
    name: "Back knee angle at max external rotation"
    short: "Back knee at max ER"
    definition: "Drive-leg knee bend at the arm's lay-back position."
    unit: deg
    direction: context
    group: lower_half
    status: curated

  pitch_back_knee_at_release:
    name: "Back knee angle at release"
    short: "Back knee at release"
    definition: "Drive-leg knee bend when the ball comes out."
    unit: deg
    direction: context
    group: lower_half
    status: curated

  pitch_max_pelvis_linear_vel_mph:
    name: "Peak pelvis travel speed"
    short: "Pelvis travel speed"
    definition: "How fast the hips move down the mound (not rotation — travel)."
    unit: mph
    direction: higher_better
    group: lower_half
    status: curated

  pitch_max_trunk_linear_vel_mph_y:
    name: "Peak torso travel speed"
    short: "Torso travel speed"
    definition: "How fast the chest moves toward the plate."
    unit: mph
    direction: higher_better
    group: lower_half
    status: curated

  pitch_trunk_cog_vel_at_release_mph_y:
    name: "Torso travel speed at release"
    short: "Torso speed at release"
    definition: "How fast the chest is still moving toward the plate when the ball comes out."
    unit: mph
    direction: context
    group: lower_half
    status: curated

  # ── Arm action ─────────────────────────────────────────────────────────
  pitch_max_external_rotation_simple:
    name: "Max external rotation (lay-back)"
    short: "Max ER"
    definition: "How far the throwing arm lays back before it turns over."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_max_external_rotation_xyz:
    name: "Max external rotation (3-axis)"
    short: "Max ER (XYZ)"
    definition: "Lay-back measured with the full three-axis shoulder model."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_max_horizontal_abduction:
    name: "Max horizontal abduction"
    short: "Max horiz abduction"
    definition: >-
      How far behind the plane of the shoulders the elbow travels. Large
      values are the classic 'arm drag behind the body' pattern.
    unit: deg
    direction: context
    group: arm
    cue: "Keep the elbow in front of the shoulder line."
    status: curated

  pitch_time_to_max_abduction_ms:
    name: "Time to max abduction"
    short: "Time to max abduction"
    definition: "How long into the delivery the arm reaches its widest point."
    unit: ms
    direction: context
    group: timing
    status: curated

  pitch_peak_abduction:
    name: "Peak shoulder abduction"
    short: "Peak abduction"
    definition: "How high the arm is carried away from the body at its peak."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_shoulder_y_at_fc:
    name: "Shoulder abduction at foot strike"
    short: "Shoulder abd at FS"
    definition: "Arm slot height at the moment the front foot lands."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_shoulder_y_at_max_er:
    name: "Shoulder abduction at max external rotation"
    short: "Shoulder abd at max ER"
    definition: "Arm slot height at full lay-back."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_shoulder_at_fc_120ms_x:
    name: "Shoulder angle 120 ms before foot strike"
    short: "Shoulder (−120 ms)"
    definition: "Where the arm is a tenth of a second before landing — catches early arm timing."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_arm_timing_at_fc_simple:
    name: "Arm timing at foot strike"
    short: "Arm timing at FS"
    definition: "Whether the arm is on schedule, early or late when the front foot lands."
    unit: deg
    direction: context
    group: timing
    status: curated

  pitch_arm_er_timing_at_fc_xyz:
    name: "Arm external-rotation timing at foot strike"
    short: "ER timing at FS"
    definition: "How much lay-back the arm has already reached at landing."
    unit: deg
    direction: context
    group: timing
    status: curated

  pitch_elbow_flex_at_max_er:
    name: "Elbow flexion at max external rotation"
    short: "Elbow flex at max ER"
    definition: "How bent the elbow is at the arm's lay-back position."
    unit: deg
    direction: context
    group: arm
    status: curated

  pitch_elbow_ang_vel_max:
    name: "Peak elbow extension speed"
    short: "Peak elbow speed"
    definition: "Fastest the elbow straightens."
    unit: deg/s
    direction: higher_better
    group: arm
    status: curated

  pitch_humerus_ang_vel_max:
    name: "Peak upper-arm rotation speed"
    short: "Peak humerus speed"
    definition: "Fastest the upper arm internally rotates — the last big link in the chain."
    unit: deg/s
    direction: higher_better
    group: arm
    status: curated

  pitch_hand_ang_vel_max:
    name: "Peak hand speed"
    short: "Peak hand speed"
    definition: "Fastest the hand moves — the closest kinematic proxy to ball speed."
    unit: deg/s
    direction: higher_better
    group: arm
    status: curated

  # ── Posture & direction ────────────────────────────────────────────────
  pitch_trunk_lateral_at_fc:
    name: "Torso side-bend at foot strike"
    short: "Side-bend at FS"
    definition: "How far the chest is tilted to the side when the front foot lands."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_trunk_lateral_at_release:
    name: "Torso side-bend at release"
    short: "Side-bend at release"
    definition: "How far the chest is tilted to the glove side at ball release."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_trunk_flexion_at_release:
    name: "Torso forward tilt at release"
    short: "Forward tilt at release"
    definition: "How far the chest has folded over the front leg when the ball comes out."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_total_trunk_flexion:
    name: "Total torso forward tilt"
    short: "Total trunk flexion"
    definition: "Total range of forward trunk tilt through the delivery."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_trunk_rotation_at_fc:
    name: "Torso rotation at foot strike"
    short: "Torso rotation at FS"
    definition: "How far the chest has opened to the target when the front foot lands."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_pelvic_obliquity_total:
    name: "Total pelvic tilt range"
    short: "Pelvic obliquity range"
    definition: "How much the pelvis tips side to side across the delivery."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_pelvis_obliquity_at_fc:
    name: "Pelvic side-tilt at foot strike"
    short: "Pelvic tilt at FS"
    definition: "Whether the front hip is higher or lower than the back hip at landing."
    unit: deg
    direction: context
    group: posture
    status: curated

  pitch_pelvis_obliquity_at_release:
    name: "Pelvic side-tilt at release"
    short: "Pelvic tilt at release"
    definition: "Whether the front hip is higher or lower than the back hip at release."
    unit: deg
    direction: context
    group: posture
    status: curated

  # ── Timing ─────────────────────────────────────────────────────────────
  pitch_release_time:      {name: "Time to release", short: "Release time", definition: "Elapsed time from the start of the delivery to ball release.", unit: s, direction: context, group: timing, status: curated}
  pitch_time_max_pelvis_vel: {name: "Time of peak pelvis speed", short: "Peak pelvis time", definition: "When in the delivery the hips hit top rotation speed.", unit: s, direction: context, group: timing, status: curated}
  pitch_time_max_thorax_vel: {name: "Time of peak torso speed", short: "Peak torso time", definition: "When in the delivery the chest hits top rotation speed.", unit: s, direction: context, group: timing, status: curated}
  pitch_time_max_humerus_vel: {name: "Time of peak upper-arm speed", short: "Peak humerus time", definition: "When the upper arm hits top rotation speed.", unit: s, direction: context, group: timing, status: curated}
  pitch_time_max_hand_vel: {name: "Time of peak hand speed", short: "Peak hand time", definition: "When the hand hits top speed.", unit: s, direction: context, group: timing, status: curated}
  pitch_max_elbow_vel_time: {name: "Time of peak elbow speed", short: "Peak elbow time", definition: "When the elbow hits top extension speed.", unit: s, direction: context, group: timing, status: curated}
  pitch_max_shoulder_rot_time: {name: "Time of max external rotation", short: "Max ER time", definition: "When the arm reaches full lay-back.", unit: s, direction: context, group: timing, status: curated}

  # ── Arm load (never rendered good/bad) ─────────────────────────────────
  pitch_max_elbow_varus_torque_nm:
    name: "Peak elbow varus torque"
    short: "Elbow varus torque"
    definition: >-
      Peak stress across the inside of the elbow. Scales with velocity, so a
      rise alongside a velo jump is expected, not a red flag on its own.
      Watch it per-mph rather than in absolute terms.
