    name: "Elbow torque at max external rotation"
    short: "Elbow torque at max ER"
    definition: "Elbow stress at the arm's lay-back position — usually the peak-stress instant."
    unit: Nm
    direction: load
    group: load
    status: curated

  pitch_shoulder_force_abd_at_max:
    name: "Peak shoulder abduction force"
    short: "Shoulder abd force"
    definition: "Peak force pulling the arm away from the shoulder socket."
    unit: N
    direction: load
    group: load
    status: curated

